name: Build Hook Core (Native & Java)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Memungkinkan menjalankan build manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Langkah ini sangat krusial untuk mendeteksi apakah file JAR kamu ter-upload
      - name: Debug Project Structure
        run: |
          echo "=== Menampilkan isi folder app/libs ==="
          ls -R app/libs || echo "Folder libs TIDAK DITEMUKAN!"
          echo "=== Menampilkan isi folder jni ==="
          ls -R app/src/main/jni || echo "Folder jni TIDAK DITEMUKAN!"

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Build Artifact (AAR)
        uses: actions/upload-artifact@v4
        with:
          name: hook-core-release
          path: app/build/outputs/aar/*.aar
