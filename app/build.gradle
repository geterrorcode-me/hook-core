plugins {
    id 'com.android.library'
}

android {
    compileSdk 34
    namespace 'black.hook'
    defaultConfig {
        minSdk 21
        // Menentukan arsitektur HP yang didukung
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
    
    dependencies {
    // Jalur paling aman agar tidak terjadi 'cannot find symbol'
    implementation files('libs/reflection.jar')
    }
    
    
    task downloadDobby {
    doLast {
        def dobbyDir = file("src/main/jni/external/dobby")
        if (!dobbyDir.exists()) {
            dobbyDir.mkdirs()
            // Mengambil prebuilt binary dari repository resmi Dobby
            // Kita akan mendownload versi yang sudah jadi agar praktis
            println "Downloading Dobby binaries..."
            // (Logika download manual atau git clone submodule bisa ditaruh di sini)
        }
      }
    }

     preBuild.dependsOn downloadDobby

}
